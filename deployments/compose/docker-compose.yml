services:
  postgres-ledger:
    image: postgres:18-alpine
    container_name: pigeon-db
    command: ["postgres", "-c", "log_statement=ddl", "-c", "log_connections=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pigeoncoop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-edge_ledger}
    ports:
      - "${PIGEONS_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - pigeon_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - pigeon-net

  # Optional external MQTT broker (PigeonCoop embeds a pure-Go MQTT broker by default;
  # start with `--profile external-mqtt` if offloading to standalone Mosquitto).
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: pigeon-broker
    profiles: ["external-mqtt"]
    ports:
      - "${PIGEONS_BIND_IP:-127.0.0.1}:1883:1883"
      - "${PIGEONS_BIND_IP:-127.0.0.1}:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks:
      - pigeon-net

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: pigeon-ntfy
    command: serve
    ports:
      - "${PIGEONS_BIND_IP:-127.0.0.1}:2586:80"
    environment:
      - NTFY_BASE_URL=http://127.0.0.1:2586
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    restart: unless-stopped
    networks:
      - pigeon-net

networks:
  pigeon-net:
    driver: bridge

volumes:
  pigeon_db_data:
