services:
  postgres-ledger:
    image: postgres:18-alpine
    container_name: pigeon-db
    command: ["postgres", "-c", "log_statement=ddl", "-c", "log_connections=on", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pigeoncoop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-edge_ledger}
    ports:
      - "${PIGEONS_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - pigeon_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - pigeon-net

  # Optional external MQTT broker (PigeonCoop embeds a pure-Go MQTT broker by default;
  # start with `--profile external-mqtt` if offloading to standalone Mosquitto).
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: pigeon-broker
    profiles: ["external-mqtt"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-pigeoncoop}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-ctd_mqtt_dev_password}
      MQTT_EDGE_USERNAME: ${MQTT_EDGE_USERNAME:-pigeoneer}
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD:-ctd_edge_dev_password}
      # Optional comma-separated per-node credentials (node_id:password,...) for strict
      # Mosquitto %u per-node ACL isolation (recommended when edge nodes are untrusted).
      MQTT_EDGE_NODES: ${MQTT_EDGE_NODES:-}
      # Dev-only opt-in: set true on trusted single-tenant LANs to allow the shared
      # MQTT_EDGE_USERNAME account to publish/subscribe across edge node IDs (still
      # blocking pigeons/requests/runner, pigeons/registry/mesh, and # wildcards).
      MQTT_ALLOW_SHARED_EDGE_ACL: ${MQTT_ALLOW_SHARED_EDGE_ACL:-false}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        passwd_tmp="$$(mktemp /mosquitto/data/.passwd.tmp.XXXXXX)"
        trap 'rm -f "$${passwd_tmp}"' EXIT
        chmod 0600 "$${passwd_tmp}"
        mosquitto_passwd -b "$${passwd_tmp}" "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        if [ -n "$${MQTT_EDGE_USERNAME}" ] && [ "$${MQTT_EDGE_USERNAME}" != "$${MQTT_USERNAME}" ]; then
          mosquitto_passwd -b "$${passwd_tmp}" "$${MQTT_EDGE_USERNAME}" "$${MQTT_EDGE_PASSWORD}"
        fi
        if [ -n "$${MQTT_EDGE_NODES}" ]; then
          OLD_IFS="$$IFS"
          case "$$-" in
            *f*) was_noglob=1 ;;
            *) was_noglob=0 ;;
          esac
          set -f
          IFS=','
          for entry in $${MQTT_EDGE_NODES}; do
            node_user="$${entry%%:*}"
            node_pass="$${entry#*:}"
            if [ -n "$${node_user}" ] && [ "$${node_pass}" != "$${entry}" ] && [ -n "$${node_pass}" ]; then
              mosquitto_passwd -b "$${passwd_tmp}" "$${node_user}" "$${node_pass}"
            fi
          done
          IFS="$$OLD_IFS"
          if [ "$${was_noglob}" -eq 0 ]; then
            set +f
          fi
        fi
        chown mosquitto:mosquitto "$${passwd_tmp}" 2>/dev/null || true
        chmod 0600 "$${passwd_tmp}"
        mv -f "$${passwd_tmp}" /mosquitto/data/passwd
        trap - EXIT

        awk -v admin_user="$${MQTT_USERNAME}" '{
          if ($$0 == "user pigeoncoop") {
            print "user " admin_user
          } else {
            print $$0
          }
        }' /mosquitto/config/acl.conf > /mosquitto/data/acl.conf
        if [ "$${MQTT_ALLOW_SHARED_EDGE_ACL:-false}" = "true" ] && [ -n "$${MQTT_EDGE_USERNAME}" ] && [ "$${MQTT_EDGE_USERNAME}" != "$${MQTT_USERNAME}" ]; then
          {
            printf '\n# Dev-only shared edge user fallback (MQTT_ALLOW_SHARED_EDGE_ACL=true)\n'
            printf 'user %s\n' "$${MQTT_EDGE_USERNAME}"
            printf 'topic write pigeons/ctd/+/+/+\n'
            printf 'topic write pigeons/registry/+/status\n'
            printf 'topic write pigeons/registry/+/hello\n'
            printf 'topic read pigeons/control/+\n'
          } >> /mosquitto/data/acl.conf
        fi
        chmod 0600 /mosquitto/data/acl.conf
        chown mosquitto:mosquitto /mosquitto/data/acl.conf 2>/dev/null || true
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "${PIGEONS_BIND_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl.conf:/mosquitto/config/acl.conf:ro
      - pigeon_mqtt_data:/mosquitto/data
    restart: unless-stopped
    networks:
      - pigeon-net

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: pigeon-ntfy
    command: serve
    ports:
      - "${PIGEONS_BIND_IP:-127.0.0.1}:2586:80"
    environment:
      - NTFY_BASE_URL=http://127.0.0.1:2586
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    restart: unless-stopped
    networks:
      - pigeon-net

networks:
  pigeon-net:
    driver: bridge

volumes:
  pigeon_db_data:
  pigeon_mqtt_data:
