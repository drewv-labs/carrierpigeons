# CarrierPigeons External Mosquitto ACLs
# Mirrors internal/pigeoncoop/broker/embedded.go (perNodeAuthHook) least-privilege boundaries.
#
# Admin / Hub / Workstation user (rendered dynamically from MQTT_USERNAME in docker-compose.yml):
#   - PigeonCoop ingestor subscribes to pigeons/ctd/#, pigeons/registry/+/status,
#     pigeons/registry/+/hello, pigeons/requests/runner and publishes pigeons/registry/mesh
#     and pigeons/control/<node_id>.
#   - Workstation CLI/TUI (pigeons) reads pigeons/registry/mesh and publishes pigeons/requests/runner.
user pigeoncoop
topic readwrite pigeons/#

# Per-node edge isolation via %u (MQTT username == <node_id>):
#   - Pigeoneer connects with client_id="pigeoneer-<node_id>" (internal/node/relay/mqtt.go),
#     whereas Mosquitto's %c token expands the full client_id without prefix stripping
#     ("pigeoneer-<node_id>" != "<node_id>"). Moreover, client_id is client-asserted unless
#     bound via mTLS CN/SAN, so %c ACLs would both reject real Pigeoneer nodes and allow
#     spoofing via client_id selection.
#   - Provisioning per-node credentials with username=<node_id> (via MQTT_EDGE_NODES in
#     docker-compose.yml or `mosquitto_passwd`) binds %u to the node's own topics while
#     blocking cross-node spoofing and control-plane/admin topics (pigeons/requests/runner,
#     pigeons/registry/mesh, and wildcard subscriptions).
#   - Edge nodes do not subscribe to pigeons/registry/mesh (MNS discovery is hub/CLI only).
pattern write pigeons/ctd/+/%u/+
pattern write pigeons/registry/%u/status
pattern write pigeons/registry/%u/hello
pattern read pigeons/control/%u
