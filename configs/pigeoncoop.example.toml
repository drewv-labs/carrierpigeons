# PigeonCoop Unified Hub Configuration (RISC-V / ARM64 / x86_64)
# PigeonCoop natively observes its own hardware and executes Runners alongside
# operating the MQTT broker, batched PostgreSQL COPY ingestor, and Ntfy alerting.

# Registered Mesh Name System (MNS) identifier (RFC 1123 lowercase kebab-case).
# Persisted in `ctd_mesh` and announced on `<topic_root>/registry/mesh` for `pigeons connect <mesh>`.
mesh_name      = "rv64-lab"
node_id        = "rv64-coop-01"
tags           = ["coop", "databroker", "riscv64"]
self_observe   = true
poll_interval  = "5s"
spool_capacity = 10000

[mqtt]
# "embedded" runs an in-process pure-Go MQTT v5/v3.1.1 broker; set "external" for Mosquitto.
# Bind "127.0.0.1:1883" for single-host testing, or "0.0.0.0:1883" with credentials + TLS for LAN fleets.
mode          = "embedded"
listen        = "127.0.0.1:1883"
url           = "tcp://127.0.0.1:1883"
username      = ""
password      = ""
# Shared edge credential: isolates edge nodes from admin/control-plane topics
# (`requests/runner`, `registry/mesh`, wildcards, and other nodes' `control/<id>`),
# and restricts writes to the MQTT client_id's own `ctd/.../<node_id>/...` and
# `registry/<node_id>/{status,hello}` topics.
# Trust boundary: any host holding this shared credential can choose its MQTT
# client_id and impersonate another edge node's `node_id`; use TLS + client
# certificates or an external broker with per-node credentials when edge nodes
# are mutually untrusted.
edge_username = ""
edge_password = ""

[database]
url       = "postgres://ctd_ingestor:ctd_ingest_password@127.0.0.1:5432/edge_ledger"
max_conns = 24
min_conns = 2

[ingest]
queue_size     = 65536
batch_size     = 2000
flush_interval = "100ms"

[ntfy]
enabled = true
url     = "http://127.0.0.1:2586/carrier-pigeons"

[observers]
os  = true
net = true
gpu = true
npu = true

[runners]
enabled              = true
allow_ephemeral      = false
allowed_interpreters = ["sh", "bash", "python3"]
max_timeout_sec      = 300
