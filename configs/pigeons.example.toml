# Pigeons Workstation Control Plane Configuration

broker_url            = "tcp://127.0.0.1:1883"
database_url          = "postgres://pigeoncoop_admin:ctd_dev_password@127.0.0.1:5432/edge_ledger"
readonly_database_url = "postgres://pigeoncare_ro:pigeoncare_readonly@127.0.0.1:5432/edge_ledger"
operator              = "operator"

[mqtt]
username    = ""
password    = ""
tls_ca_file = ""

[llm]
provider = "ollama"
model    = "qwen2.5-coder"
endpoint = "http://127.0.0.1:11434"

[permissions]
# Agent execution confirmation mode:
# - "default":   Prompt [Allow / Always Allow / Deny] before Runners and PigeonMath DDL
# - "auto_edit": Auto-approve read-only diagnostics & PigeonMath views; prompt before Runners
# - "yolo":      Autonomous execution of diagnostics, PigeonMath views, and Ephemeral Runners
mode                  = "default"
allowed_runners       = ["benchmark", "SyntheticComputeRnr"]
allowed_script_hashes = []

[math]
refresh_interval = "60s"

# Optional multi-mesh profiles for `pigeons connect <mesh-name>` ("cwd"-style working mesh switcher).
# Unset fields inherit top-level `[llm]`, `[permissions]`, `[math]`, and `operator` defaults.
# Active working mesh is persisted in `~/.config/pigeons/current_mesh` (or overridden via `--mesh` / `PIGEONS_MESH`).
#
# [meshes.compute-mesh]
# broker_url            = "tcp://192.0.2.10:1883"
# database_url          = "postgres://pigeoncoop_admin:change_me@192.0.2.10:5432/edge_ledger"
# readonly_database_url = "postgres://pigeoncare_ro:change_me_ro@192.0.2.10:5432/edge_ledger"
#
# [meshes.sensor-mesh]
# broker_url            = "tcp://192.0.2.20:1883"
# database_url          = "postgres://pigeoncoop_admin:change_me@192.0.2.20:5432/edge_ledger"
# readonly_database_url = "postgres://pigeoncare_ro:change_me_ro@192.0.2.20:5432/edge_ledger"
