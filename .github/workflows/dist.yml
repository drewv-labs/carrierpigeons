name: Carrier Pigeons Distribution

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # Triggers a formal release on version tags (e.g., v1.0.0)
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Vet & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Run Vet & Unit Tests
        run: |
          go vet ./...
          go test -race -count=1 ./...

  build:
    name: Build Go Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [riscv64, arm64, amd64]
        exclude:
          # Apple does not make RISC-V hardware
          - goos: darwin
            goarch: riscv64
          # Windows distribution targets amd64
          - goos: windows
            goarch: riscv64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Build Binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          # Build Pigeoneer (Edge Daemon)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeoneer-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeoneer

          # Build PigeonCoop (Hub Injector)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeoncoop-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeoncoop

          # Build PigeonMCP (Model Context Protocol Sidecar)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeonmcp-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeonmcp

          # Build Pigeons (CLI / TUI)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeons-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeons

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carrier-pigeons-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: artifacts
        run: |
          sha256sum * > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true
