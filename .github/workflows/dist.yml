name: Carrier Pigeons Distribution

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # Triggers a formal release on version tags (e.g., v1.0.0)
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Vet & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Vet & Unit Tests
        run: |
          go vet ./...
          go test -race -count=1 ./...

  build:
    name: Build Go Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64, riscv64]
        exclude:
          # Apple does not make RISC-V hardware
          - goos: darwin
            goarch: riscv64
          # Windows distribution targets amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: riscv64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          # Build Pigeoneer (Edge Daemon)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeoneer-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeoneer

          # Build PigeonCoop (Hub Injector)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeoncoop-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeoncoop

          # Build PigeonMCP (Model Context Protocol Sidecar)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeonmcp-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeonmcp

          # Build Pigeons (CLI / TUI)
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/pigeons-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/pigeons

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carrier-pigeons-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: artifacts
        run: |
          sha256sum * > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
